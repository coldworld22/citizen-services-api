services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: eservices
      POSTGRES_USER: eservices
      POSTGRES_PASSWORD: eservices
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eservices -d eservices"]
      interval: 5s
      retries: 10
    volumes:
      - db-data:/var/lib/postgresql/data

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/eservices
      DB_USERNAME: eservices
      DB_PASSWORD: eservices
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env (see .env.example)}
      OTP_EXPOSE_CODE: "true"
    ports:
      - "8080:8080"

volumes:
  db-data:
