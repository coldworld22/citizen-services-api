spring:
  application:
    name: citizen-services-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/eservices}
    username: ${DB_USERNAME:eservices}
    password: ${DB_PASSWORD:eservices}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    # db/demo seeds four demo accounts. Set FLYWAY_LOCATIONS=classpath:db/migration to leave them out.
    locations: ${FLYWAY_LOCATIONS:classpath:db/migration,classpath:db/demo}
  mvc:
    problemdetails:
      enabled: true
  ldap:
    # Staff directory. For Active Directory, e.g. ldaps://dc01.example.gov.sa:636 with a read-only
    # service account in LDAP_BIND_DN / LDAP_BIND_PASSWORD to look users up before checking passwords.
    urls: ${LDAP_URL:ldap://localhost:389}
    base: ${LDAP_BASE:dc=example,dc=local}
    username: ${LDAP_BIND_DN:}
    password: ${LDAP_BIND_PASSWORD:}

server:
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html

app:
  rate-limit:
    auth-requests-per-minute: ${AUTH_RATE_LIMIT_PER_MINUTE:30}
  directory:
    user-base: ${LDAP_USER_BASE:ou=staff}
    # sAMAccountName for Active Directory; uid for OpenLDAP and the test directory.
    username-attribute: ${LDAP_USERNAME_ATTRIBUTE:sAMAccountName}
  jwt:
    # Base64-encoded key of at least 32 bytes. Required: there is deliberately no default.
    secret: ${JWT_SECRET}
    ttl: 30m
  otp:
    ttl: 5m
    max-attempts: 5
    max-requests-per-window: 5
    window: 15m
    # Demo only: include the code in the API response. Never enable with real users.
    expose-code: ${OTP_EXPOSE_CODE:false}
